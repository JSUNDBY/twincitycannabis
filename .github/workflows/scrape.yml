name: Scrape Dispensary Data

on:
  schedule:
    # Run 2x daily: 7am and 7pm Central (12:00 and 00:00 UTC)
    - cron: '0 12,0 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Scrape dispensary listings
        id: listings
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scraper/scraper.py --export
        continue-on-error: true

      - name: Update dispensaries in data.js
        run: python scraper/update_site.py
        continue-on-error: true

      - name: Scrape ALL menus (full product data)
        id: menus
        env:
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python scraper/direct_menu_scrape.py --update-site
        continue-on-error: true

      - name: Record price history
        run: |
          python scraper/price_tracker.py record || true
          python scraper/price_tracker.py export || true
        continue-on-error: true

      - name: Pull menus from dispensary.shop platform
        # direct_menu_scrape replaced TCC.products from Weedmaps; this
        # appends shops on the dispensary.shop platform (e.g. Fort Road)
        # with id prefix 'ds####'.
        run: |
          python scraper/dispensary_shop_scrape.py || true
          python scraper/merge_dispensary_shop_data.py || true
          python scraper/meadow_scrape.py || true
          python scraper/merge_meadow_data.py || true
        continue-on-error: true

      - name: Merge Google Places data + clean orphaned refs
        # Overlays real dispensary websites, phones, ratings, and reviews from
        # the committed Google Places cache onto the freshly-scraped dispensary
        # set (the Weedmaps scrape only yields Weedmaps profile URLs), then drops
        # any orphaned price/review refs. The local Pi pipeline always ran these;
        # CI did not, so production kept showing Weedmaps links. Order matters:
        # after the dispensary set is built, before the SEO pages are generated.
        run: |
          python scraper/merge_google_data.py || true
          python scraper/clean_orphans.py || true
        continue-on-error: true

      - name: Backfill strain type (indica/sativa/hybrid)
        # The live scrape now captures strainType from Weedmaps; this fills
        # remaining gaps using the dispensaries' own labels (explicit type words
        # + learned strain phrases). Never invents a type. Skips already-tagged.
        run: python scraper/backfill_strain_type.py || true
        continue-on-error: true

      - name: Set up Node for SEO build
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Brand data quality (consolidate + image backfill)
        # Rewrites js/data.js, so guard: if it fails to parse afterward, revert
        # to the pre-step copy so a broken data file never deploys.
        run: |
          cp js/data.js /tmp/tcc_data_prebrand.js
          python scraper/consolidate_brands.py --apply || true
          python scraper/backfill_images.py || true
          node -e 'global.window={};require("./js/data.js")' 2>/dev/null \
            || { echo "data.js broke — reverting"; cp /tmp/tcc_data_prebrand.js js/data.js; }
        continue-on-error: true

      - name: Generate real price-drop deals
        # Turn detected price drops in priceHistory into the deals feed (no
        # invented promos; outlier drops >45% are rejected as data artifacts).
        run: node scraper/generate_deals.js || true
        continue-on-error: true

      - name: Rebuild static SEO pages
        run: node scripts/build_seo.js
        continue-on-error: true

      - name: Prune orphaned pages
        # Delete stale page directories the build no longer emits (old strain /
        # product / city pages from earlier runs) so they stop being served with
        # weeks-old prices and absent from the sitemap. Uses `git rm`, so the
        # deletions are staged for the commit below. Has its own safety guards
        # and aborts without deleting anything if the build looks broken.
        run: python scripts/prune_orphans.py --apply
        continue-on-error: true

      - name: Commit and push if changed
        run: |
          git config user.name "TCC Scraper Bot"
          git config user.email "bot@twincitycannabis.com"
          git add js/data.js index.html sitemap.xml \
            scraper/data/price_history.json scraper/data/price_history_export.json \
            scraper/data/dispensaries.json scraper/data/full_menu_products.json \
            scraper/data/dispensary_shop_products.json \
            scraper/data/last_weedmaps_scrape.txt \
            llms.txt 2>/dev/null || true
          # The sitemap is the manifest: stage every page the build just
          # declared in it, so no generated surface (compare/, cheapest-
          # {category}-{city}, strain-city, calculators, ...) is silently
          # left behind serving stale prices, and a new page can never hit
          # the pushed sitemap without its HTML being pushed too.
          grep -o '<loc>https://twincitycannabis.com/[^<]*</loc>' sitemap.xml \
            | sed 's|<loc>https://twincitycannabis.com/||;s|</loc>||;s|/$||' \
            | while read -r p; do
                [ -n "$p" ] && [ -f "$p/index.html" ] && git add "$p" || true
              done
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: $(date -u +%Y-%m-%d\ %H:%M) - fresh prices & menus"
            git push
          fi

      - name: Fail if Weedmaps menu data has gone stale
        # The Weedmaps source of truth is the Mac's launchd scrape (residential
        # IP, no proxy needed) — CI's own Weedmaps steps are expected to fail
        # from datacenter IPs unless a working PROXY_URL secret is set, and
        # that's fine. What is NOT fine is the DATA going stale: the scraper
        # stamps scraper/data/last_weedmaps_scrape.txt on every successful menu
        # scrape (Mac or CI), and this gate turns the run red + emails the
        # owner if no fresh stamp has landed in 48h. Menus froze silently for
        # 2+ weeks (May 26 - Jun 12, 2026) before this existed.
        run: |
          marker=scraper/data/last_weedmaps_scrape.txt
          if [ ! -f "$marker" ]; then
            echo "::warning::No freshness marker yet — first run after this gate shipped."
            exit 0
          fi
          last=$(date -d "$(cat "$marker")" +%s)
          age=$(( ( $(date +%s) - last ) / 3600 ))
          echo "Weedmaps menus last scraped ${age}h ago ($(cat "$marker"))"
          if [ "$age" -gt 48 ]; then
            echo "::error::Weedmaps menus are ${age}h stale — the Mac scraper (launchd com.twincitycannabis.scrape) hasn't pushed fresh data. Check scraper/data/auto_scrape.err on the Mac, or whether the Mac has been off/asleep."
            exit 1
          fi
