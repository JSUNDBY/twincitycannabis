<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Twin City Cannabis — Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a07;
    --text: #f4fff7;
    --text-soft: rgba(244,255,247,0.55);
    --green: #22c55e;
    --green-bright: #4ade80;
    --green-glow: rgba(34,197,94,0.40);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #1a1a1a;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 2rem;
    -webkit-font-smoothing: antialiased;
  }

  /* Card 2.25 x 3.75 in (bleed); trim 2 x 3.5 in.
     Content safe-zone: 0.20 in inside trim = ~1.6 x 3.1 in usable */
  .card {
    position: relative;
    width: 2.25in;
    height: 3.75in;
    overflow: hidden;
    border-radius: 14px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
    background:
      radial-gradient(circle at 50% 0%, var(--green-glow) 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, rgba(22,163,74,0.35) 0%, transparent 50%),
      linear-gradient(180deg, #0a1410 0%, var(--bg) 80%, #000 100%);
  }
  .card::after {
    content: ""; position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 25% 30%, rgba(255,255,255,0.02) 1px, transparent 2px);
    background-size: 4px 4px;
    pointer-events: none; mix-blend-mode: overlay;
  }

  /* Trim guide */
  .card::before {
    content: ""; position: absolute; inset: 0.125in;
    border: 1px dashed rgba(255,255,255,0.08);
    border-radius: 8px;
    pointer-events: none; z-index: 10;
  }
  @media print { .card::before { display: none; } }

  /* Printable inner frame */
  .frame {
    position: absolute; inset: 0.18in;
    border: 1px solid rgba(34,197,94,0.18);
    border-radius: 6px;
    pointer-events: none;
  }

  /* Six-row grid that physically can't overflow */
  .content {
    position: absolute;
    inset: 0.125in;
    padding: 0.30in 0.18in;
    display: grid;
    grid-template-rows:
      auto    /* logo */
      auto    /* wordmark */
      auto    /* rule */
      auto    /* tagline */
      1fr     /* breathing space */
      auto    /* qr */
      auto    /* url */
    ;
    justify-items: center;
    text-align: center;
    gap: 0.10in;
    overflow: hidden;
  }

  .mark {
    width: 0.62in;
    height: 0.62in;
    filter: drop-shadow(0 0 12px var(--green-glow));
  }

  .wordmark {
    font-size: 11.5pt;
    font-weight: 800;
    letter-spacing: 0.28em;
    color: var(--text);
    text-transform: uppercase;
    line-height: 1;
    margin-top: 0.02in;
    /* "TWIN CITY" and "CANNABIS" stacked */
    display: flex;
    flex-direction: column;
    gap: 0.04in;
  }
  .wordmark .accent { color: var(--green-bright); }

  .rule {
    width: 0.32in;
    height: 2px;
    background: var(--green-bright);
    border-radius: 1px;
    margin-top: 0.02in;
  }

  .tagline {
    font-size: 7pt;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text-soft);
    line-height: 1.4;
    max-width: 1.5in;
  }

  .qr {
    width: 1.10in;
    height: 1.10in;
    background: var(--text);
    padding: 0.06in;
    border-radius: 6px;
    box-shadow: 0 0 24px var(--green-glow);
    display: flex; align-items: center; justify-content: center;
  }
  .qr svg { width: 100%; height: 100%; display: block; }
  .qr svg path { fill: #0a1410; }

  .url {
    font-size: 9.5pt;
    font-weight: 800;
    letter-spacing: -0.005em;
    color: var(--text);
    line-height: 1;
  }
  .url .dot { color: var(--green-bright); }

  @page { size: 2.25in 3.75in; margin: 0; }
  @media print {
    html, body { background: #fff; padding: 0; }
    .card { box-shadow: none; border-radius: 0; }
  }
</style>
</head>
